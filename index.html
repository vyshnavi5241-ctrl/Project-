<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TremorSense | Clinical Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Status Badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success-color);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(16, 185, 129, 0.2);
      transition: all 0.3s ease;
    }
    
    .status-badge.error {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .status-badge.waiting {
      background-color: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.2);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: currentColor;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Main Content */
    main {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    /* Cards */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
    }

    .card-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .card-unit {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Chart Section */
    .chart-card {
      grid-column: 1 / -1;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    .chart-container {
      flex: 1;
      position: relative;
      width: 100%;
      margin-top: 1rem;
    }

    /* Highlight specific cards */
    .accent-card { border-top: 4px solid var(--accent-color); }
    .success-card { border-top: 4px solid var(--success-color); }

    /* Loading state */
    .loading {
      opacity: 0.5;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <span class="logo-icon">⚕️</span>
      <h1>TremorSense Dashboard</h1>
    </div>
    <div id="status-badge" class="status-badge waiting">
      <div class="dot"></div>
      <span id="status-text">Connecting to Telemetry...</span>
    </div>
  </header>

  <main>
    <!-- Top Row: Latest Readings -->
    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">Accel X</div>
        <div class="card-value" id="val-ax">-- <span class="card-unit">g</span></div>
      </div>
      <div class="card">
        <div class="card-header">Accel Y</div>
        <div class="card-value" id="val-ay">-- <span class="card-unit">g</span></div>
      </div>
      <div class="card">
        <div class="card-header">Accel Z</div>
        <div class="card-value" id="val-az">-- <span class="card-unit">g</span></div>
      </div>
      <div class="card accent-card">
        <div class="card-header">Magnitude |A|</div>
        <div class="card-value" id="val-amag" style="color: var(--accent-color);">-- <span class="card-unit">g</span></div>
      </div>
    </div>

    <!-- Bottom Row: Chart -->
    <div class="card chart-card">
      <div class="card-header">
        <span>Real-Time Tremor Trace</span>
        <span id="record-count" style="color: var(--text-muted); font-size: 0.75rem;">0 / 150 Records</span>
      </div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMFhfjnGO4waR7Uata_jBeYAW8SqAKAp0",
      authDomain: "project-dfcc5.firebaseapp.com",
      databaseURL: "https://project-dfcc5-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "project-dfcc5",
      storageBucket: "project-dfcc5.firebasestorage.app",
      messagingSenderId: "999174035196",
      appId: "1:999174035196:web:13fcac381ecbeeff9b6979"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // UI Elements
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const chartCtx = document.getElementById('trendChart').getContext('2d');
    const recordCountEl = document.getElementById('record-count');

    // Setup Gradient for Chart
    let gradient = chartCtx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
    gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

    // Initialize Chart.js
    let chart = new Chart(chartCtx, {
      type: 'line',
      data: { 
        labels: [], 
        datasets: [{ 
          label: 'Magnitude', 
          data: [], 
          borderColor: '#38bdf8',
          backgroundColor: gradient,
          borderWidth: 2, 
          tension: 0.4, 
          pointRadius: 0,
          fill: true
        }] 
      },
      options: {
        responsive: true, 
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { display: false },
          y: { 
            beginAtZero: false, 
            grid: { color: 'rgba(255, 255, 255, 0.05)' },
            ticks: { color: '#94a3b8' },
            title: { display: true, text: 'Acceleration Magnitude (g)', color: '#94a3b8' }
          }
        },
        plugins: { 
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            titleColor: '#f8fafc',
            bodyColor: '#38bdf8',
            borderColor: '#334155',
            borderWidth: 1,
            displayColors: false
          }
        }
      }
    });

    // Listen for Firebase Data
    const recentRef = query(ref(db, 'readings'), limitToLast(150));

    onValue(recentRef, (snapshot) => {
      const data = snapshot.val();
      
      if (!data) { 
        statusText.textContent = 'Waiting for ESP32...'; 
        statusBadge.className = 'status-badge waiting';
        return; 
      }

      const entries = Object.entries(data)
        .map(([key, v]) => ({ key, ...v }))
        .sort((a, b) => (a.ts || 0) - (b.ts || 0));

      if (entries.length === 0) return;

      // Update UI Status
      statusText.textContent = 'Live Data Streaming';
      statusBadge.className = 'status-badge';
      
      // Update Record Count
      recordCountEl.textContent = `${entries.length} / 150 Records`;

      // Update Latest Values
      const latest = entries[entries.length - 1];
      document.getElementById('val-ax').innerHTML = `${latest.ax?.toFixed(2) ?? '--'} <span class="card-unit">g</span>`;
      document.getElementById('val-ay').innerHTML = `${latest.ay?.toFixed(2) ?? '--'} <span class="card-unit">g</span>`;
      document.getElementById('val-az').innerHTML = `${latest.az?.toFixed(2) ?? '--'} <span class="card-unit">g</span>`;
      document.getElementById('val-amag').innerHTML = `${latest.amag?.toFixed(3) ?? '--'} <span class="card-unit">g</span>`;

      // Update Chart
      chart.data.labels = entries.map((_, i) => i);
      chart.data.datasets[0].data = entries.map(e => e.amag);
      chart.update('none');
      
    }, (error) => {
      statusText.textContent = 'Permission Denied';
      statusBadge.className = 'status-badge error';
      console.error(error);
    });
  </script>
</body>
</html>
